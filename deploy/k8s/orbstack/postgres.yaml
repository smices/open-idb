apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: open-idb
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: idbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: idbridge
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: idbridge-postgres
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - idbridge
                - -d
                - idbridge
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: open-idb
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: idbridge
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
