apiVersion: apps/v1
kind: Deployment
metadata:
  name: idbridge-frontend
  namespace: open-idb
  labels:
    app: idbridge-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idbridge-frontend
  template:
    metadata:
      labels:
        app: idbridge-frontend
    spec:
      containers:
        - name: frontend
          image: open-idb-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idbridge-frontend
  namespace: open-idb
spec:
  selector:
    app: idbridge-frontend
  ports:
    - port: 80
      targetPort: 80
