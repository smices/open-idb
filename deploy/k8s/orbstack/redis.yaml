apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: open-idb
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: idbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: idbridge
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: open-idb
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: idbridge
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
