apiVersion: batch/v1
kind: Job
metadata:
  name: idbridge-migrate
  namespace: open-idb
  labels:
    app.kubernetes.io/name: idbridge-migrate
    app.kubernetes.io/part-of: idbridge
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idbridge-migrate
        app.kubernetes.io/part-of: idbridge
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: open-idb:dev
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -lc
            - goose -dir /app/migrations postgres "$DATABASE_URL" up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idbridge-postgres
                  key: DATABASE_URL
